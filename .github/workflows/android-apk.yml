name: Build words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: words-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and wordbooks
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble and repair source archive
        run: |
          cat source_chunks/part00 source_chunks/part01 source_chunks/part02 source_chunks/part03 source_chunks/part04 source_chunks/part05 source_chunks/part06 source_chunks/part07 source_chunks/part08 source_chunks/part09 > words-android-source.zip.b64
          base64 --decode words-android-source.zip.b64 > words-android-source.zip
          if ! unzip -t words-android-source.zip; then
            echo "Original source archive has a small transport corruption; attempting ZIP recovery."
            zip -FF words-android-source.zip --out words-android-source.repaired.zip
            mv words-android-source.repaired.zip words-android-source.zip
            unzip -t words-android-source.zip
          fi
          unzip -q -o words-android-source.zip -d .

      - name: Patch Android source compatibility and default wordbook
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          main = Path("words-android/app/src/main/java/com/words/app/MainActivity.kt")
          text = main.read_text(encoding="utf-8")
          old = "ScrollView.LayoutParams("
          assert old in text, "Expected ScrollView.LayoutParams call was not found"
          main.write_text(text.replace(old, "ViewGroup.LayoutParams("), encoding="utf-8")
          db = Path("words-android/app/src/main/java/com/words/app/WordsDatabase.kt")
          text = db.read_text(encoding="utf-8")
          text, count = re.subn(
              r'const val BUILTIN_BOOK_ID\s*=\s*"[^"]+"',
              'const val BUILTIN_BOOK_ID = "gaokao_standard_2025"',
              text,
          )
          assert count == 1, f"Expected one built-in book ID constant, found {count}"
          db.write_text(text, encoding="utf-8")
          print("Patched ScrollView layout params and selected 2025 curriculum book by default.")
          PY

      - name: Install offline wordbooks into Android assets
        run: |
          mkdir -p words-android/app/src/main/assets/books
          mkdir -p words-android/app/src/main/assets/licenses
          cp wordbooks/*.json words-android/app/src/main/assets/books/
          cp wordbooks/KyleBing-LICENSE.txt words-android/app/src/main/assets/licenses/
          cp wordbooks/SOURCES.md words-android/app/src/main/assets/licenses/
          echo "Wordbook JSON files:"
          ls -lh words-android/app/src/main/assets/books/
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("words-android/app/src/main/assets/books")
          total = 0
          for path in root.glob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              words = data.get("words", [])
              assert words, f"{path.name}: no words"
              assert all(w.get("word") and w.get("meaning") for w in words), f"{path.name}: missing word/meaning"
              total += len(words)
              print(f"{path.name}: {len(words)} words")
          print(f"Total across independent books (overlap not deduplicated): {total}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: words-android

      - name: Upload reconstructed Android source
        uses: actions/upload-artifact@v4
        with:
          name: words-source-tree
          path: words-android/
          if-no-files-found: error
          retention-days: 3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-debug-apk
          path: words-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
