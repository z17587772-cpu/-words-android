name: Build words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: words-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Normalize, test and build words
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and normalize the Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -d android ]; then
            PROJECT_DIR=android
          else
            cat source_chunks/part00 source_chunks/part01 source_chunks/part02 source_chunks/part03 source_chunks/part04 source_chunks/part05 source_chunks/part06 source_chunks/part07 source_chunks/part08 source_chunks/part09 > /tmp/words-source.zip.b64
            base64 --decode /tmp/words-source.zip.b64 > /tmp/words-source.zip
            if ! unzip -t /tmp/words-source.zip; then
              zip -FF /tmp/words-source.zip --out /tmp/words-source-repaired.zip
              mv /tmp/words-source-repaired.zip /tmp/words-source.zip
              unzip -t /tmp/words-source.zip
            fi
            unzip -q -o /tmp/words-source.zip -d .
            python tools/upgrade_project.py words-android
            PROJECT_DIR=words-android
          fi

          # Preserve the original curriculum book as the default selection.
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re, sys
          project = Path(sys.argv[1])
          p = project / "app/src/main/java/com/words/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8").replace("ScrollView.LayoutParams(", "ViewGroup.LayoutParams(")
          p.write_text(s, encoding="utf-8")
          db = project / "app/src/main/java/com/words/app/WordsDatabase.kt"
          s = db.read_text(encoding="utf-8")
          s, n = re.subn(r'const val BUILTIN_BOOK_ID\s*=\s*"[^"]+"', 'const val BUILTIN_BOOK_ID = "gaokao_standard_2025"', s)
          if n != 1:
              raise SystemExit(f"Expected one built-in wordbook ID, found {n}")
          db.write_text(s, encoding="utf-8")
          PY

          mkdir -p "$PROJECT_DIR/app/src/main/assets/books" "$PROJECT_DIR/app/src/main/assets/licenses"
          python tools/sync_wordbooks.py wordbooks
          python tools/enrich_wordbook_pos.py wordbooks
          python tools/enrich_wordbooks.py "$PROJECT_DIR" wordbooks
          cp wordbooks/*.json "$PROJECT_DIR/app/src/main/assets/books/"
          cp wordbooks/KyleBing-LICENSE.txt "$PROJECT_DIR/app/src/main/assets/licenses/"
          cp wordbooks/ECDICT-LICENSE-MIT.txt "$PROJECT_DIR/app/src/main/assets/licenses/"
          cp wordbooks/WordTyper-LICENSE-MIT.txt "$PROJECT_DIR/app/src/main/assets/licenses/"
          cp wordbooks/WordTyper-NOTICE.md "$PROJECT_DIR/app/src/main/assets/licenses/"
          cp wordbooks/NGSL-ATTRIBUTION.txt "$PROJECT_DIR/app/src/main/assets/licenses/"
          cp wordbooks/SOURCES.md "$PROJECT_DIR/app/src/main/assets/licenses/"

          # Persist enriched source wordbooks (not only the copies inside the APK).
          git add wordbooks
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: persist corpus frequency annotations [skip ci]"
            git push origin HEAD:main
          fi

          # Validate the shipped offline dictionaries before compiling.
          python - "$PROJECT_DIR/app/src/main/assets/books" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          all_words = 0
          matched = 0
          for path in sorted(root.glob("*.json")):
              pack = json.loads(path.read_text(encoding="utf-8"))
              words = pack.get("words", [])
              assert words, f"{path.name}: no words"
              assert all(w.get("word") and w.get("meaning") for w in words), f"{path.name}: missing headword or meaning"
              all_words += len(words)
              matched += sum(1 for w in words if w.get("corpus_frequency", -1) >= 0)
              print(f"{path.name}: {len(words):,} words; {sum(1 for w in words if w.get('corpus_frequency', -1) >= 0):,} corpus matches")
          print(f"Total: {all_words:,} entries; {matched:,} corpus-frequency matches.")
          PY

          # Standard project layout: keep only source/resources, not transient Gradle outputs.
          if [ "$PROJECT_DIR" = "words-android" ]; then
            mv words-android android
            PROJECT_DIR=android
            find android -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
            cat > android/.gitignore <<'EOF'
          .gradle/
          build/
          **/build/
          local.properties
          *.iml
          .idea/
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android wordbooks
            git rm -r -f --ignore-unmatch source_chunks source_archive || true
            git commit -m "chore: normalize Android source layout [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate wordbook assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          project = Path("android")
          for p in (project / "app/src/main/assets/books").glob("*.json"):
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data.get("words"), p
              assert all(w.get("meaning") for w in data["words"]), p
          source = (project / "app/src/main/java/com/words/app/MainActivity.kt").read_text(encoding="utf-8")
          import re
          def function_body(name):
              start = source.index(f"private fun {name}")
              following = re.search(r"\n    private fun ", source[start + 1:])
              end = start + 1 + following.start() if following else len(source)
              return source[start:end]
          study_body = function_body("renderStudy")
          answer_body = function_body("renderQuizAnswer")
          assert 'text("今日背词计划"' in study_body, "Study must begin with the daily plan"
          assert "返回" not in study_body, "Study screen must not contain a back-navigation row"
          assert "返回选项" not in answer_body and "ANSWER REVIEW" not in answer_body, "Answer review must not contain a back row"
          print("Wordbook schema and Study no-back-row checks passed.")
          PY

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: android

      - name: Prepare install package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/words.apk
          unzip -t dist/words.apk >/dev/null
          sha256sum dist/words.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-debug-apk
          path: dist/words.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload normalized Android source
        uses: actions/upload-artifact@v4
        with:
          name: words-source-tree
          path: android/
          if-no-files-found: error
          retention-days: 7

      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          target_commitish: main
          name: words 1.8.0
          body: |
            words 1.8.0 — refreshes curriculum vocabulary and adds licensed offline wordbooks.

            - Rebuilds the 2025 curriculum wordbook using structured Appendix 2 headwords and ECDICT dictionary data.
            - Adds CET-4, CET-6, IELTS, TOEFL, GRE, postgraduate, SAT, GMAT and NGSL/NAWL wordbooks.
            - Matching words preserve existing review progress and favorites; removed words are deactivated instead of deleted.
            - Bundles MIT and CC BY-SA attribution/license notices.


            - The incoming card keeps its final “点击翻面” cue throughout the transition, avoiding a text swap at rest.
            - Card motion tracks the finger directly; a single coordinated exit/entry animation preserves the drag position.
            - Browse index and history are committed once after the outgoing card finishes; short flings and interrupted drags settle cleanly.

            - After answering, the original question remains visible; the selected and correct options are highlighted immediately.
            - Tap any option to open the structured answer explanation.
            - Explanation is organized into core meaning, word information, examples with Chinese translations, dictionary definitions, word forms and related words.
            - Quick Browse fits the initial view without vertical scrolling where the device viewport permits; edge pulls retain the native rebound effect.
            - Swipe left advances to the next word and sends the current card left; swipe right returns to the previous word and sends it right. Each direction reveals the correct matching under-card.
            - Round progress and its bar are removed; the Quick Browse card is slightly taller, with 12 dp of clear space before the three action buttons.
            - Card position is committed at gesture acceptance and rendered once after exit; no second rightward entrance bounce.
            - Card faces no longer use drop shadows.
            - Choose whether English or Chinese is the default card face; flipping always reveals the other language without masking state.
            - Card faces share a compact layout and show IPA, part of speech and third-party combined-corpus frequency when available.
            - Quick Browse guarantees full wordbook coverage and interleaves bonus appearances sampled by curriculum importance and corpus-frequency tier; recently browsed words stay in cooldown.
            - Optional sound and haptic feedback for right/wrong answers and card navigation.
            - Dictionary enrichment appears on the current explanation as soon as online data arrives; individual Chinese machine-reference translations update in place without rebuilding the whole answer page, and the reading position is preserved when new dictionary data arrives.
            - Dictionary senses prioritize Chinese translations; source definitions remain available as smaller English references.
            - Collocation snippets are shown from dictionary fields when available, otherwise clearly labelled as extracted from real example sentences.
            - Inflection labels are translated into Chinese (past tense, past participle, plural, comparative, etc.); no unsupported root is guessed. A direct Youdao full-entry link opens its public dictionary page.
            - Keeps optional cached FreeDictionaryAPI / Wiktionary expansion, system TTS, favorites, and user-provided vector launcher icon.
            - Example sentence translations use MyMemory's public translation endpoint and are labelled as machine-translation references.

            Dictionary meaning groups remain inline with a subtle gap between major senses; the first/main sense stays bold. Dictionary expansion typography increases by only 1sp. Online dictionary data refreshes the existing dictionary card in place, avoiding a full explanation-page rebuild.

            All page content now starts 12 dp below the system status-bar inset across Browse, Study, Books, Stats, Settings and Favorites.
            The Study plan is 15 dp below the return row, and the question card is 15 dp below the progress bar.
            Meaning formatting recognizes n./v./vt./vi./adj./adv. and related POS tags throughout the raw definition. Chinese semicolons separate major senses with a subtle gap; Chinese commas keep related glosses together. Repeated bracket notes such as [病毒] 病毒 are deduplicated, only POS tokens receive blue styling, and the wordbook POS field fills a missing inline POS marker.
            Global content inset is 12 dp below the status-bar/system inset across pages.
            Quick Browse's Chinese side now uses the same POS-aware meaning formatter as Study. Repeated n./v. source entries merge into one POS group; duplicate glosses are removed, related glosses use the enumeration comma 、, and major senses use a smaller single-en-space gap.
            The actual Study question screen no longer shows the top ‹ 返回 / DAILY QUIZ row; 今日背词计划 is now the first content at the top.
            Combined POS metadata such as v./n. is parsed into separate blue labels when legacy source definitions have no inline markers. vt./vi. are normalized to v. so declared verb POS is not lost.
            Enumeration punctuation is reduced to 48% size; different major senses use a full em-space gap, making the boundary clearer without splitting each gloss onto a new line. The question and answer screens both start with the daily plan/progress area and contain no visible back row.
            Missing POS labels are filled from ECDICT's pinned corpus POS field and local school-wordbook TSV records. The built-in packs are upgraded to version 3 so existing installations refresh the metadata in place while keeping separate review history.
            Study progress-to-question/result-card and result-card-to-word-card gaps remain consistently 15 dp.

            This is a debug-signed APK for direct testing.
          files: dist/words.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
