name: Build words APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: words-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Read-only Android build and APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate bundled wordbooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/books")
          packs = sorted(root.glob("*.json"))
          if not packs:
              raise SystemExit("No bundled wordbook JSON files found")
          for path in packs:
              data = json.loads(path.read_text(encoding="utf-8"))
              words = data.get("words", [])
              if not words or not all(item.get("word") and item.get("meaning") for item in words):
                  raise SystemExit(f"{path.name}: empty or invalid word list")
          print(f"Validated {len(packs)} bundled wordbooks.")
          PY

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: android

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
