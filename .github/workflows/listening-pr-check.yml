name: Validate listening module PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/listening-pr-check.yml'
      - 'wordbooks/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listening-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listening-validation:
    name: Validate listening module and database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate bundled wordbook assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/books")
          packs = sorted(root.glob("*.json"))
          if not packs:
              raise SystemExit("No bundled wordbook JSON files found")
          for path in packs:
              data = json.loads(path.read_text(encoding="utf-8"))
              words = data.get("words", [])
              if not words:
                  raise SystemExit(f"{path.name}: empty word list")
              if not all(item.get("word") and item.get("meaning") for item in words):
                  raise SystemExit(f"{path.name}: missing word or meaning")
          print(f"Validated {len(packs)} bundled wordbooks.")
          PY

      - name: Verify blind-listening answer-key boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          models = Path("android/app/src/main/java/com/words/app/ListeningModels.kt").read_text(encoding="utf-8")
          repository = Path("android/app/src/main/java/com/words/app/ListeningRepository.kt").read_text(encoding="utf-8")
          activity = Path("android/app/src/main/java/com/words/app/MainActivity.kt").read_text(encoding="utf-8")
          option = models.split("data class ListeningOption(", 1)[1].split(")", 1)[0]
          assert "isCorrect" not in option, "UI option model must not expose answer correctness"
          assert '"SELECT id,content,is_correct FROM listening_choices' not in repository, "Option query leaks answer key"
          assert "option.isCorrect" not in activity and "selected.isCorrect" not in activity, "Activity must not inspect answer keys"
          assert "fun recordAnswer(attemptId: Long, questionId: String, choiceId: Long): Boolean" in repository
          seed = repository.split("fun ensureDemoSeeded()", 1)[1].split("fun getTodayEpisodeId()", 1)[0]
          assert "listening_daily_assignments" not in seed, "Demo content must not be written as a formal daily assignment"
          print("Blind-listening answer-key and demo-assignment boundary checks passed.")
          PY

      - name: Verify content package and playback safety boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/java/com/words/app")
          validator = (root / "ListeningContentPackageValidator.kt").read_text(encoding="utf-8")
          integrity = (root / "ListeningAudioIntegrity.kt").read_text(encoding="utf-8")
          archive = (root / "ListeningPackageArchive.kt").read_text(encoding="utf-8")
          service = (root / "ListeningPlaybackService.kt").read_text(encoding="utf-8")
          coordinator = (root / "ListeningPlaybackCoordinator.kt").read_text(encoding="utf-8")
          database = (root / "WordsDatabase.kt").read_text(encoding="utf-8")
          migration_test = Path("android/app/src/androidTest/java/com/words/app/WordsDatabaseMigrationTest.kt").read_text(encoding="utf-8")
          assert "SUPPORTED_SCHEMA_VERSION = 1" in validator
          assert "evidence_sentence_id" in validator and "in_app_playback" in validator
          assert "MAX_AUDIO_SIZE_BYTES" in validator
          assert "MessageDigest.getInstance(\"SHA-256\")" in integrity
          assert "ATOMIC_MOVE" in integrity and "resolveUnderRoot" in integrity
          assert "MAX_ENTRIES" in archive and "MAX_TOTAL_UNCOMPRESSED_BYTES" in archive
          assert "Duplicate archive entry" in archive and "deleteRecursively()" in archive
          assert "CHECKPOINT_INTERVAL_MS = 5_000L" in service
          assert "checkpointNow()" in service and "setMediaId(episode.id)" in coordinator
          assert "audio_revision" in database
          assert "content_revision_id" in database
          assert "listening_episode_revisions" in database
          assert "listening_revision_questions" in repository
          assert "attempt.content_revision_id" in repository
          assert "fun getQuestionsForAttempt" in repository
          assert "fun getSentencesForAttempt" in repository
          assert "fun getEpisodeForAttempt" in repository
          assert "attemptReviewReadsPinnedSnapshotInsteadOfMutableCatalogRows" in migration_test
          assert "episode.playbackRevision(audioUri) != itemRevision" in service
          assert "currentItem.mediaId != id" in coordinator
          assert "upgradingV6AddsAudioRevisionWithoutLosingSavedPlayback" in migration_test
          repository = (root / "ListeningRepository.kt").read_text(encoding="utf-8")
          planner = (root / "ListeningDailyPlanner.kt").read_text(encoding="utf-8")
          assert "assignDailyEpisode" in repository and "e.status='approved' AND e.is_demo=0" in repository
          assert "fun getAttemptAnswerReviews" in repository
          assert "Completed attempt has no persisted score" in repository
          assert "post-completion-question" in migration_test
          assert "attempt.completed_at IS NOT NULL" in repository
          assert "ListeningDailyPlanner.choose" in repository and "stableTieBreak" in planner
          assert "correctContent" in (root / "ListeningModels.kt").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/listening-pr-check.yml").read_text(encoding="utf-8")
          forbidden_build = "assemble" + "Debug"
          forbidden_upload = "upload" + "-artifact"
          assert forbidden_build not in workflow and forbidden_upload not in workflow
          apk_workflow = Path(".github/workflows/android-apk.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in apk_workflow
          assert "pull_request:" not in apk_workflow and "\npush:" not in apk_workflow
          assert "ANDROID_I_WANT_MY_TCG" in workflow
          print("Package validation, audio integrity, background playback, emulator fallback and no-APK PR boundaries passed.")
          PY

      - name: Run database migration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && gradle --no-daemon --stacktrace connectedDebugAndroidTest

