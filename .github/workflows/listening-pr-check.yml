name: Validate listening module PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/listening-pr-check.yml'
      - 'wordbooks/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listening-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listening-validation:
    name: Validate listening module and database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate bundled wordbook assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/books")
          packs = sorted(root.glob("*.json"))
          if not packs:
              raise SystemExit("No bundled wordbook JSON files found")
          for path in packs:
              data = json.loads(path.read_text(encoding="utf-8"))
              words = data.get("words", [])
              if not words:
                  raise SystemExit(f"{path.name}: empty word list")
              if not all(item.get("word") and item.get("meaning") for item in words):
                  raise SystemExit(f"{path.name}: missing word or meaning")
          print(f"Validated {len(packs)} bundled wordbooks.")
          PY

      - name: Verify blind-listening answer-key boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          models = Path("android/app/src/main/java/com/words/app/ListeningModels.kt").read_text(encoding="utf-8")
          repository = Path("android/app/src/main/java/com/words/app/ListeningRepository.kt").read_text(encoding="utf-8")
          activity = Path("android/app/src/main/java/com/words/app/MainActivity.kt").read_text(encoding="utf-8")
          option = models.split("data class ListeningOption(", 1)[1].split(")", 1)[0]
          assert "isCorrect" not in option, "UI option model must not expose answer correctness"
          assert '"SELECT id,content,is_correct FROM listening_choices' not in repository, "Option query leaks answer key"
          assert "option.isCorrect" not in activity and "selected.isCorrect" not in activity, "Activity must not inspect answer keys"
          assert "fun recordAnswer(attemptId: Long, questionId: String, choiceId: Long): Boolean" in repository
          seed = repository.split("fun ensureDemoSeeded()", 1)[1].split("fun getTodayEpisodeId()", 1)[0]
          assert "listening_daily_assignments" not in seed, "Demo content must not be written as a formal daily assignment"
          print("Blind-listening answer-key and demo-assignment boundary checks passed.")
          PY

      - name: Verify content package and playback safety boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/java/com/words/app")
          validator = (root / "ListeningContentPackageValidator.kt").read_text(encoding="utf-8")
          integrity = (root / "ListeningAudioIntegrity.kt").read_text(encoding="utf-8")
          archive = (root / "ListeningPackageArchive.kt").read_text(encoding="utf-8")
          service = (root / "ListeningPlaybackService.kt").read_text(encoding="utf-8")
          coordinator = (root / "ListeningPlaybackCoordinator.kt").read_text(encoding="utf-8")
          database = (root / "WordsDatabase.kt").read_text(encoding="utf-8")
          importer = (root / "ListeningContentPackageImporter.kt").read_text(encoding="utf-8")
          repository = (root / "ListeningRepository.kt").read_text(encoding="utf-8")
          activity = (root / "MainActivity.kt").read_text(encoding="utf-8")
          migration_test = Path("android/app/src/androidTest/java/com/words/app/WordsDatabaseMigrationTest.kt").read_text(encoding="utf-8")
          assert "SUPPORTED_SCHEMA_VERSION = 1" in validator
          assert "evidence_sentence_id" in validator and "in_app_playback" in validator
          assert "offline_download" in validator
          assert "'%,offline_download,%'" in repository
          assert "MAX_AUDIO_SIZE_BYTES" in validator
          assert "MessageDigest.getInstance(\"SHA-256\")" in integrity
          assert "ATOMIC_MOVE" in integrity and "resolveUnderRoot" in integrity
          assert "MAX_ENTRIES" in archive and "MAX_TOTAL_UNCOMPRESSED_BYTES" in archive
          assert "Duplicate archive entry" in archive and "deleteRecursively()" in archive
          assert "CHECKPOINT_INTERVAL_MS = 5_000L" in service
          assert "checkpointNow()" in service and "setMediaId(episode.id)" in coordinator
          assert "audio_revision" in database
          assert "content_revision_id" in database
          assert "listening_episode_revisions" in database
          assert "listening_revision_questions" in repository
          assert "listening_content_packages" in database and "listening_package_episodes" in database
          assert "class ListeningContentPackageImporter" in importer
          assert "ExpectedChoice" in importer and "revision_hash" in importer
          assert "expectedSentenceIds[expected.id]" in importer
          assert "expectedQuestionIds[expected.id]" in importer
          assert "metadata.currentRevisionId != expectedRevision" in importer
          assert "Installed package is incomplete or its immutable audio failed verification" in importer
          assert "snapshotArchive" in importer and "MAX_ARCHIVE_BYTES" in importer
          assert "stagingRoot.usableSpace >= archiveBytes + STORAGE_RESERVE_BYTES" in importer
          assert "extractSafely(input, extractedRoot, STORAGE_RESERVE_BYTES)" in importer
          assert "minimumFreeBytes <= root.usableSpace - read.toLong()" in archive
          assert "usableSpace >= requiredAudioBytes + STORAGE_RESERVE_BYTES" in importer
          assert "synchronized(CONTENT_LOCK)" in importer
          assert "copyAndVerifyNew" in importer and "recoverOrphanedAudioFiles" in importer
          assert "Package version already exists with a different archive digest" in importer
          assert "Package downgrade rejected" in importer
          assert "listening_package_episodes" in repository
          assert "attempt.content_revision_id" in repository
          assert "fun getQuestionsForAttempt" in repository
          assert "fun getSentencesForAttempt" in repository
          assert "fun getEpisodeForAttempt" in repository
          assert "fun getEpisodeForDailyAssignment" in repository
          assert "getEpisodeForDailyAssignment(java.time.LocalDate.now().toString()" in activity
          assert "fun getAttemptProgress" in repository and "fun getAttemptAnswer" in repository
          assert "fun getLatestIncompleteAttempt" in repository and "fun abandonAttempt" in repository
          assert "getLatestIncompleteAttempt()" in activity
          assert "fun isKnownPlaybackRevision" in repository
          assert "isKnownPlaybackRevision(episodeId, audioUri, itemRevision, position)" in service
          assert "fun getAttemptCorrectCount" in repository and "fun updateAttemptStage" in repository
          assert "restoreListeningAttemptState" in activity and "persistListeningAttemptUiState" in activity
          assert "transitionListeningStage" in activity and "setDuration(115L)" in activity and "setDuration(220L)" in activity
          assert "preserveListeningPosition" in activity and "previousScrollY.coerceAtMost(maxScroll)" in activity
          assert "PathInterpolator(0.4f, 0f, 1f, 1f)" in activity and "PathInterpolator(0.16f, 1f, 0.3f, 1f)" in activity
          assert "attemptReviewReadsPinnedSnapshotInsteadOfMutableCatalogRows" in migration_test
          assert "upgradingV7ToV11BackfillsSnapshotsAndPinsExistingAttempts" in migration_test
          assert "packageImporterIsIdempotentVersionSafeAndPreservesAttemptRevision" in migration_test
          assert "packageArchivePreservesConfiguredFreeSpaceReserve" in migration_test
          assert "Idempotent import accepted a tampered immutable question snapshot" in migration_test
          assert "dailyPlannerRejectsStreamingOnlyLicense" in migration_test
          assert "getEpisodeForAttempt" in activity and "getQuestionsForAttempt" in activity
          quiz_screen = activity.split("private fun renderListeningQuiz", 1)[1].split("private fun addListeningSpeedControls", 1)[0]
          assert "getSentencesForAttempt(listeningAttemptId)" in quiz_screen
          assert "getSentences(episode.id)" not in quiz_screen
          review_screen = activity.split("private fun renderListeningReview", 1)[1].split("private fun renderStats", 1)[0]
          assert "answerReviews.values.count { it.isCorrect }" in review_screen
          assert "listeningCorrectCount * 100" not in review_screen
          assert "isKnownPlaybackRevision(episodeId, audioUri, itemRevision, position)" in service
          assert "currentItem.mediaId != id" in coordinator
          assert "upgradingV6ToV11PreservesAudioRevisionAndSavedPlayback" in migration_test
          assert "packageImporterCannotPromoteTheSystemTtsDemoToFormalContent" in migration_test
          assert 'SQLiteOpenHelper(context, "words_local.db", null, 11)' in database
          planner = (root / "ListeningDailyPlanner.kt").read_text(encoding="utf-8")
          assert "assignDailyEpisode" in repository and "status='approved' AND is_demo=0" in repository and "e.status='approved' AND r.is_demo=0" in repository
          assert "fun getAttemptAnswerReviews" in repository
          assert "Completed attempt has no persisted score" in repository
          assert "post-completion-question" in migration_test
          assert "attempt.completed_at IS NOT NULL" in repository
          assert "ListeningDailyPlanner.choose" in repository and "stableTieBreak" in planner
          assert "assignmentCount" in planner and "lastAssignedDate" in planner
          assert "COUNT(*),MAX(d.assignment_date)" in repository
          assert "getAssignmentHistory(assignmentDate)" in repository
          assert "dailyPlannerCompletesWholeCatalogPassAndAddsNewLessonsBeforeRepeats" in migration_test
          assert "correctContent" in (root / "ListeningModels.kt").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/listening-pr-check.yml").read_text(encoding="utf-8")
          forbidden_build = "assemble" + "Debug"
          forbidden_upload = "upload" + "-artifact"
          assert forbidden_build not in workflow and forbidden_upload not in workflow
          apk_workflow = Path(".github/workflows/android-apk.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in apk_workflow
          assert "pull_request:" not in apk_workflow and "\npush:" not in apk_workflow
          assert "ANDROID_I_WANT_MY_TCG" in workflow
          assert ":app:compileDebugKotlin" in workflow and ":app:compileDebugAndroidTestKotlin" in workflow
          assert "99-kvm4all.rules" in workflow
          assert 'echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"' in workflow
          print("Package validation, audio integrity, background playback, emulator fallback and no-APK PR boundaries passed.")
          PY

      - name: Compile app and instrumentation sources without packaging an APK
        run: cd android && gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin

      - name: Enable KVM or prepare emulator TCG fallback
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
            echo "KVM unavailable; explicitly enabling supported TCG fallback."
          else
            echo "KVM is available; emulator will use hardware acceleration."
          fi

      - name: Run database migration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && gradle --no-daemon --stacktrace connectedDebugAndroidTest

