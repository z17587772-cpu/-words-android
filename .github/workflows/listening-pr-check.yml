name: Validate listening module PR (APK packaging paused)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/listening-pr-check.yml'
      - 'wordbooks/**'
      - 'tools/**'
      - 'README.md'
      - 'android/PROJECT_STATUS.txt'
      - 'LISTENING_*.md'
  push:
    branches: [feature/listening-mvp]
    paths:
      - 'android/**'
      - '.github/workflows/listening-pr-check.yml'
      - 'wordbooks/**'
      - 'tools/**'
      - 'README.md'
      - 'android/PROJECT_STATUS.txt'
      - 'LISTENING_*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listening-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listening-validation:
    name: Validate listening module and database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content pipeline test dependencies
        run: python -m pip install -r tools/content_pipeline/requirements.txt

      - name: Test continuous content discovery and signed catalog publishing
        run: python -m unittest discover -s tools/content_pipeline -p 'test_*.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Sync complete wordbook catalog into Android assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path("wordbooks")
          target = Path("android/app/src/main/assets/books")
          expected = {
              "gaokao_standard_2025.json": ("gaokao_standard_2025", 3097),
              "highschool_extension_3743.json": ("highschool_extension_3743", 3743),
              "cet4_core.json": ("cet4_core", 3815),
              "cet6_core.json": ("cet6_core", 5371),
              "ielts_core.json": ("ielts_core", 4974),
              "toefl_core.json": ("toefl_core", 6959),
              "gre_core.json": ("gre_core", 7485),
              "kaoyan_core.json": ("kaoyan_core", 4787),
              "sat_core.json": ("sat_core", 4471),
              "gmat_core.json": ("gmat_core", 2996),
              "ngsl_nawl_core_3000.json": ("ngsl_nawl_core_3000", 3000),
          }
          target.mkdir(parents=True, exist_ok=True)
          missing = sorted(set(expected) - {p.name for p in source.glob("*.json")})
          if missing:
              raise SystemExit(f"Missing source wordbooks: {missing}")

          for stale in target.glob("*.json"):
              if stale.name not in expected:
                  stale.unlink()

          for filename, (expected_id, expected_count) in expected.items():
              src = source / filename
              payload = json.loads(src.read_text(encoding="utf-8"))
              words = payload.get("words")
              if payload.get("id") != expected_id:
                  raise SystemExit(f"{filename}: unexpected pack id {payload.get('id')!r}")
              if not isinstance(words, list) or len(words) != expected_count:
                  raise SystemExit(f"{filename}: expected {expected_count} entries, got {len(words) if isinstance(words, list) else 'invalid'}")
              if any(not isinstance(row, dict) or not row.get("word") or not row.get("meaning") for row in words):
                  raise SystemExit(f"{filename}: word/meaning field is missing")
              shutil.copy2(src, target / filename)
              source_hash = hashlib.sha256(src.read_bytes()).hexdigest()
              target_hash = hashlib.sha256((target / filename).read_bytes()).hexdigest()
              if source_hash != target_hash:
                  raise SystemExit(f"{filename}: asset copy checksum mismatch")
              print(f"SYNCED {filename}: {len(words)} words sha256={source_hash}")

          print(f"Wordbook catalog synchronized: {len(expected)} packs.")
          PY

      - name: Validate bundled wordbook assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/books")
          packs = sorted(root.glob("*.json"))
          if not packs:
              raise SystemExit("No bundled wordbook JSON files found")
          for path in packs:
              data = json.loads(path.read_text(encoding="utf-8"))
              words = data.get("words", [])
              if not words:
                  raise SystemExit(f"{path.name}: empty word list")
              if not all(item.get("word") and item.get("meaning") for item in words):
                  raise SystemExit(f"{path.name}: missing word or meaning")
          print(f"Validated {len(packs)} bundled wordbooks.")
          PY

      - name: Verify blind-listening answer-key boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          models = Path("android/app/src/main/java/com/words/app/ListeningModels.kt").read_text(encoding="utf-8")
          repository = Path("android/app/src/main/java/com/words/app/ListeningRepository.kt").read_text(encoding="utf-8")
          activity = Path("android/app/src/main/java/com/words/app/MainActivity.kt").read_text(encoding="utf-8")
          option = models.split("data class ListeningOption(", 1)[1].split(")", 1)[0]
          assert "isCorrect" not in option, "UI option model must not expose answer correctness"
          assert '"SELECT id,content,is_correct FROM listening_choices' not in repository, "Option query leaks answer key"
          assert "option.isCorrect" not in activity and "selected.isCorrect" not in activity, "Activity must not inspect answer keys"
          assert "fun recordAnswer(attemptId: Long, questionId: String, choiceId: Long): Boolean" in repository
          seed = repository.split("fun ensureDemoSeeded()", 1)[1].split("fun getTodayEpisodeId()", 1)[0]
          assert "listening_daily_assignments" not in seed, "Demo content must not be written as a formal daily assignment"
          print("Blind-listening answer-key and demo-assignment boundary checks passed.")
          PY

